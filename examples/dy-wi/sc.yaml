apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: csi-gcs-dy-nokey
provisioner: gcs.csi.shein.dev
volumeBindingMode: Immediate
allowVolumeExpansion: true
reclaimPolicy: Delete
mountOptions:
  - -o=allow_other
  - --gid=0
  - --dir-mode=0775
  - --file-mode=0775
  - --implicit-dirs
parameters:
  projectId: abc-poc-test
  location: europe-west3 #defaults to "US"
  locationType: region #"multi-region", "region", "dual-region"
  storageClass: STANDARD
