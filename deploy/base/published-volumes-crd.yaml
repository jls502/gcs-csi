apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: publishedvolumes.gcs.csi.shein.dev
spec:
  group: gcs.csi.shein.dev
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - node
                - targetPath
                - volumeHandle
                - options
                - pod
              properties:
                node:
                  type: string
                targetPath:
                  type: string
                volumeHandle:
                  type: string
                options:
                  type: object
                  additionalProperties:
                    type: string
                pod:
                  type: object
                  required:
                  - name
                  - namespace
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
  preserveUnknownFields: false
  scope: Cluster
  names:
    plural: publishedvolumes
    singular: publishedvolume
    kind: PublishedVolume
    
