apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-monitor
spec:
  selector:
    matchLabels:
      app: node-monitor
  template:
    metadata:
      labels:
        app: node-monitor
    spec:
      serviceAccountName: monitor-sa  # 关联的服务账号
      containers:
      - name: monitor
        image: prom/node-exporter:latest
        volumeMounts:
        - name: kube-token  # 挂载令牌
          mountPath: /var/run/secrets/tokens
          readOnly: true
      volumes:
      - name: kube-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600  # 1小时有效期
              audience: "monitoring-api"  # 目标API标识
